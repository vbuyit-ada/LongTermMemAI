<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長期記憶聊天面板</title>
    <!-- 🪐 極客風必備：Google Fonts 科技感字體與 TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- 📝 Markdown 與黑底高亮渲染核心套件 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0d1117;
        }
        .geek-font {
            font-family: 'Fira Code', monospace;
        }
        /* 滾動條美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #21262d;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #30363d;
        }
        /* Markdown 程式碼區塊黑底高亮覆蓋樣式 */
        .markdown-body pre {
            background-color: #161b22 !important;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 1rem;
            margin: 0.5rem 0;
            overflow-x: auto;
        }
        .markdown-body code {
            font-family: 'Fira Code', monospace;
            background-color: rgba(110, 118, 129, 0.4);
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            font-size: 85%;
        }
        .markdown-body pre code {
            background-color: transparent !important;
            padding: 0;
            font-size: 90%;
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col">

    <!-- 📊 頂部狀態列 -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🚀</span>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Long Term Memory Chat</h1>
                <p class="text-xs text-gray-400">OpenRouter 長期記憶對話系統</p>
            </div>
        </div>
        <!-- 記憶體水晶球入口橋樑 -->
        <div class="crystal-portal-zone" style="margin: 10px 0; padding: 10px; border-radius: 8px; background: rgba(79, 70, 229, 0.1); border: 1px solid rgba(79, 70, 229, 0.2);">
            <a href="crystal.html" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; color: #818cf8; text-decoration: none; font-weight: 500; font-size: 14px; transition: color 0.2s;">
                <span>🔮 開啟 Long Term Memory 記憶體水晶球監控面板</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            </a>
        </div>
        
    </header>

    <!-- Main chat interface -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Chat panel -->
        <section class="flex-1 flex flex-col h-full bg-gray-950/40">
            <!-- 訊息展示區 -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- 預設歡迎訊息 -->
                <div class="flex items-start space-x-3 max-w-3xl">
                    <div class="bg-emerald-600 text-white p-2 rounded-lg text-sm shadow-md">🧠</div>
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-sm leading-relaxed">
                        <p>你好！我是具備長期記憶與自我反思機制的 AI 夥伴。本地 ChromaDB 向量引擎已成功對接，請隨時與我對話，我會在背景默默打撈並記住我們的點點滴滴！</p>
                    </div>
                </div>
            </div>

            <!-- 輸入控制區 -->
            <div class="p-4 bg-gray-900/30 border-t border-gray-800/80">
                <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-3" onsubmit="sendMessage(event)">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="輸入對話...（例如：今天早上的熱美式好苦，但我喜歡）" 
                        class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors placeholder-gray-500"
                        autocomplete="off"
                        required
                    >
                    <button 
                        type="submit" 
                        class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-3 rounded-xl text-sm transition-all shadow-md active:scale-95 flex items-center space-x-1"
                    >
                        <span>發送</span>
                        <span>➡️</span>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- ⚙️ 前端核心 Chat 驅動邏輯 -->
    <script>
        // 配置 marked 解析器，整合 highlight.js 進行程式碼區塊高亮
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
     
        /**
         * 💬 訊息發送與 DOM 生命週期控制核心
         */
        async function sendMessage(event) {
            event.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 渲染使用者對話泡泡
            appendMessage('user', text);
            userInput.value = '';

            // 2. 建立具有唯一 ID 的「思考中」氣泡節點
            const thinkingNodeId = `thinking-${Date.now()}`;
            const thinkingNode = document.createElement('div');
            thinkingNode.id = thinkingNodeId;
            thinkingNode.className = "flex items-start space-x-3 max-w-3xl";
            thinkingNode.innerHTML = `
                <div class="bg-gray-800 text-gray-400 p-2 rounded-lg text-sm animate-pulse">🔍</div>
                <div class="bg-gray-950 border border-gray-800 text-gray-400 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-sm italic animate-pulse flex items-center space-x-2">
                    <span>🔍 正在打撈本地向量記憶、反思關聯脈絡中...</span>
                </div>
            `;
            chatBox.appendChild(thinkingNode);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. 向後端發起對話與打撈請求
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // Remove the thinking indicator before rendering the response.
                const targetBubble = document.getElementById(thinkingNodeId);
                if (targetBubble) targetBubble.remove();

                if (response.ok && data.reply) {
                    // 4. 成功解鎖！交給 marked 解析繁體中文與代碼區塊
                    appendMessage('ai', data.reply);
                } else {
                    appendMessage('system-error', `系統異常：${data.error || '未知的快取中斷'}`);
                }

            } catch (error) {
                // Also remove the thinking indicator if the request fails.
                const targetBubble = document.getElementById(thinkingNodeId);
                if (targetBubble) targetBubble.remove();
                
                appendMessage('system-error', `通訊失敗：無法連接至 Long Term Memory 後端。請檢查後端 Terminal 狀態。(${error.message})`);
            }
        }

        /**
         * 🎨 DOM 節點工廠：動態建構並美化聊天訊息
         */
        function appendMessage(role, content) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = "flex items-start space-x-3 max-w-3xl animate-fade-in";

            if (role === 'user') {
                messageWrapper.className += " ml-auto flex-row-reverse space-x-reverse";
                messageWrapper.innerHTML = `
                    <div class="bg-blue-600 text-white p-2 rounded-lg text-sm font-bold shadow-md">U</div>
                    <div class="bg-blue-900/40 border border-blue-800 text-blue-100 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-sm leading-relaxed">
                        <p class="whitespace-pre-wrap">${escapeHtml(content)}</p>
                    </div>
                `;
            } else if (role === 'ai') {
                // 🪐 使用 marked 將內容記憶解析為極客 Markdown，並套用自訂樣式類
                const parsedMarkdown = marked.parse(content);
                messageWrapper.innerHTML = `
                    <div class="bg-emerald-600 text-white p-2 rounded-lg text-sm shadow-md">AI</div>
                    <div class="markdown-body bg-gray-900 border border-gray-800 text-gray-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-sm leading-relaxed max-w-none flex-1">
                        ${parsedMarkdown}
                    </div>
                `;
            } else if (role === 'system-error') {
                messageWrapper.innerHTML = `
                    <div class="bg-rose-600 text-white p-2 rounded-lg text-sm font-bold shadow-md">⚠️</div>
                    <div class="bg-rose-950/60 border border-rose-900 text-rose-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-xs geek-font">
                        ${content}
                    </div>
                `;
            }

            chatBox.appendChild(messageWrapper);
            
            // 觸發程式碼區塊的高亮後處理
            if (role === 'ai') {
                messageWrapper.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });
            }

            // 確保視窗自動滾動至最新訊息
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * 🛡️ XSS 防禦字串跳脫工具 (僅用於純文字的使用者輸入)
         */
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(match) {
                const escapeMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return escapeMap[match];
            });
        }
    </script>
</body>
</html>
